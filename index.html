<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽毛球巅峰对决</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; overflow: hidden; background: #000; }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            z-index: 0;
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: translateY(0);
            z-index: 1;
            pointer-events: auto;
        }

        .intro-page {
            background: url('images/back.png') 50% 40% / cover no-repeat;
        }

        .intro-content { text-align: center; padding: 20px; transform: translateY(-50px); }
        .intro-title { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(231,76,60,0.5); margin-bottom: 30px; letter-spacing: 4px; }
        .intro-subtitle { font-size: clamp(1rem, 3vw, 1.5rem); color: #e74c3c; font-weight: 600; letter-spacing: 8px; }
        .intro-hint { font-size: clamp(0.8rem, 2vw, 1rem); color: rgba(255,255,255,0.6); margin-top: 40px; }

        .race-page {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .race-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.6) 30%, rgba(0,0,0,0.65) 70%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        .race-content {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1200px;
            text-align: center;
            padding: 20px;
        }

        /* 2022年印尼羽毛球公开赛 - 第5页 */
        .indonesia-page {
            background-color: #0a0a0a;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .indonesia-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: url('images/race4(1).jpeg') 30% center/cover no-repeat;
            filter: blur(2px) saturate(0.8);
            z-index: 0;
        }

        .indonesia-page::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: url('images/lee.jpg') center/cover no-repeat;
            filter: blur(2px) saturate(0.8);
            z-index: 0;
        }

        .indonesia-blend-overlay {
            position: absolute;
            top: 0;
            left: calc(50% - 120px);
            width: 240px;
            height: 100%;
            background: linear-gradient(to right, rgba(10,10,10,0.7) 0%, transparent 50%, rgba(10,10,10,0.7) 100%);
            z-index: 1;
        }

        .indonesia-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,10,10,0.65);
            z-index: 2;
        }

        .indonesia-content {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
            max-height: calc(100% - 120px);
            overflow-y: auto;
        }

        .indonesia-content::-webkit-scrollbar {
            width: 6px;
        }

        .indonesia-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .indonesia-content::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #55efc4, #00b894);
            border-radius: 3px;
        }

        .indonesia-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, #66ffd4, #11c9a4);
        }

        .indonesia-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .indonesia-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #55efc4 0%, #00b894 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(85,239,196,0.4);
            overflow: hidden;
        }

        .indonesia-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .indonesia-title {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            color: #fff;
            position: relative;
            margin-bottom: 15px;
        }

        .indonesia-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, transparent, #f1c40f, transparent);
        }

        .indonesia-event-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .indonesia-event-info span {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 2px;
        }

        .indonesia-event-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .indonesia-event-round {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 2px;
        }

        .indonesia-event-date {
            font-size: 13px;
            color: #e74c3c;
            font-weight: 600;
        }

        .indonesia-match-section {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 50px;
        }

        .indonesia-players {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .indonesia-player {
            text-align: center;
        }

        .indonesia-player-name {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-weight: 900;
            margin-bottom: 8px;
        }

        .indonesia-player-name.winner {
            color: #55efc4;
            text-shadow: 0 0 20px rgba(85,239,196,0.5);
        }

        .indonesia-player-name.loser {
            color: #fff;
        }

        .indonesia-player-title {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .indonesia-player-badge {
            display: inline-block;
            font-size: 10px;
            color: #000;
            background: #55efc4;
            padding: 3px 12px;
            border-radius: 10px;
            margin-top: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .indonesia-vs {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            background: #e74c3c;
            padding: 12px 28px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .indonesia-scoreboard {
            text-align: center;
            margin-bottom: 30px;
        }

        .indonesia-score-label {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }

        .indonesia-scores {
            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
        }

        .indonesia-score-item {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
        }

        .indonesia-score-item.normal {
            color: rgba(255,255,255,0.6);
        }

        .indonesia-score-item.highlight {
            color: #55efc4;
            text-shadow: 0 0 20px rgba(85,239,196,0.5);
        }

        .indonesia-score-divider {
            color: rgba(255,255,255,0.3);
            font-size: 1.5rem;
        }

        .indonesia-winner-section {
            text-align: center;
            margin-top: 30px;
        }

        .indonesia-winner-badge {
            display: inline-block;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            background: linear-gradient(135deg, #55efc4, #00b894);
            padding: 12px 40px;
            border-radius: 30px;
            letter-spacing: 3px;
            box-shadow: 0 8px 30px rgba(85,239,196,0.4);
        }

        .indonesia-detail-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 50px;
        }

        .indonesia-detail-card {
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indonesia-detail-card:hover {
            transform: translateY(-5px);
            border-color: rgba(85,239,196,0.3);
        }

        .indonesia-detail-card.active {
            border-color: rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.6);
        }

        .indonesia-detail-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(85,239,196,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .indonesia-detail-card.active .indonesia-detail-icon {
            background: rgba(85,239,196,0.1);
        }

        .indonesia-detail-icon svg {
            width: 22px;
            height: 22px;
            fill: #55efc4;
        }

        .indonesia-detail-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .indonesia-detail-text {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            line-height: 1.7;
        }

        @media (max-width: 768px) {
            .indonesia-detail-cards {

            }
            .indonesia-players {

            }
            .indonesia-vs {
                font-size: 1rem;
                padding: 8px 20px;
            }
        }
